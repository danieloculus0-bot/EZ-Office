name: EZ-Office offline smoke
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  offline-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          for file in shell.js lib/*.js apps/*.js; do
            node --check "$file"
          done
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test browser only (not a runtime dependency)
        run: |
          python -m pip install 'playwright==1.55.0'
          python -m playwright install --with-deps chromium
      - name: Open the real file:// application and exercise tools
        run: python tests/browser_smoke.py
